# Core defaults of the eEarly mobile libraries. Loaded by CoreDefaultsEnvironmentPostProcessor as the
# lowest-precedence property source: an application's own application.yml, profile files,
# environment variables and system properties all override these values.
#
# INFO by default: DEBUG output contains token claims and request bodies (personal and health
# data). Verbose levels live in the app's application-development.yml.
logging.level:
  root: INFO

logging:
  file:
    name: ${LOGGING_FILE_PATH:./logs/eearly-mobile.log}

server:
  port: 8081

grpc:
  server:
    port: 8082
    reflection-enabled: true

hashids:
  min-hash-length: 6

keycloak:
  auth-server-url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM:eearly-mobile}
  admin:
    client:
      id: ${KEYCLOAK_ADMIN_CLIENT_ID:eearly-user-administrator}
      secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  mobile:
    client:
      id: ${KEYCLOAK_MOBILE_CLIENT_ID:eearly-mobile}
  admin-service:
    client:
      id: ${KEYCLOAK_ADMIN_SERVICE_CLIENT_ID:admin-service}

spring:
  web.resources.add-mappings: true
  mvc:
    # throw-exception-if-no-handler-found: true
    static-path-pattern: "/**"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
      allowed-methods: GET, POST, PUT, DELETE, OPTIONS

  flyway:
    enabled: false

  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      schema: ${DB_SCHEMA:eearly_mobile}

taskqueue:
  retry.count: 10
  cron.expression: 0/15 * * * * *
  retry.delay.seconds: 10

sensor:
  dexcom:
    base-uri: ${DEXCOM_BASE_URI:https://sandbox-api.dexcom.com}
    redirect-uri: ${DEXCOM_REDIRECT_URI:}
    client:
      id: ${DEXCOM_CLIENT_ID:}
      secret: ${DEXCOM_CLIENT_SECRET:}

  ultrahuman:
    base-uri: https://partner.ultrahuman.com
    authorization: changeme

ehr:
  base-uri: ${EHR_BASE_URL}
  keycloak:
    base-url: ${EHR_KEYCLOAK_BASE_URL}
    realm: ${EHR_KEYCLOAK_REALM:eearly-ehrbase}
    client-id: ${EHR_KEYCLOAK_CLIENT_ID:ehrbase}
    client-secret: ${EHR_KEYCLOAK_CLIENT_SECRET}

# The admin service's internal API, for what the patient changes in the app (their language).
# Left blank, nothing is sent and the admin service keeps its own value.
admin-service:
  base-url: ${ADMIN_SERVICE_URL:}
  keycloak:
    base-url: ${ADMIN_KEYCLOAK_BASE_URL:}
    realm: ${ADMIN_KEYCLOAK_REALM:eearly-admin}
    client-id: ${ADMIN_KEYCLOAK_CLIENT_ID:eearly-mobile-service}
    client-secret: ${ADMIN_KEYCLOAK_CLIENT_SECRET:}

onboarding:
  api_base_url: ${ONBOARDING_API_BASE_URL}
  # One-time codes carried by onboarding links.
  code:
    # How long a link stays valid: ISO-8601 (P30D) or simple (30d).
    validity: ${ONBOARDING_CODE_VALIDITY:P30D}
  # Limit for the anonymous endpoints (app store redirect and code redemption), per client address.
  rate-limit:
    requests-per-minute: ${ONBOARDING_RATE_LIMIT_PER_MINUTE:10}
    # Use the first X-Forwarded-For address instead of the connection's address. Only behind a
    # proxy that sets (and overwrites) the header; otherwise clients could pick their own address.
    trust-forwarded-for: ${ONBOARDING_RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  app:
    base-url: ${ONBOARDING_BASE_URL}
    ios:
      store-url: ${MOBILE_APP_IOS_STORE_URL:https://eearly.result.si}
    android:
      store-url: ${MOBILE_APP_ANDROID_STORE_URL:https://si.result.eearly}
    fallback:
      url: ${MOBILE_APP_STORE_FALLBACK_URL}
  keycloak:
    base-url: ${MOBILE_KEYCLOAK_BASE_URL}
    realm: ${MOBILE_KEYCLOAK_REALM:eearly-mobile}
    client-id: ${MOBILE_KEYCLOAK_CLIENT_ID:eearly-mobile}
    host: ${MOBILE_KEYCLOAK_HOST}
