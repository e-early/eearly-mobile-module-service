logging.level:
  si.result.eearly: DEBUG
  org.springframework:
    web.client.RestTemplate: DEBUG
    security: DEBUG
    cache: TRACE


server:
  port: 8081
  servlet.context-path: /api/v1

grpc.server.port: 8082

hashids:
  min-hash-length: 6

keycloak:
  auth-server-url: ${KEYCLOAK_URL:https://keycloak.result.si}
  realm: ${KEYCLOAK_REALM:eEarly}
  admin:
    client:
      id: ${KEYCLOAK_CLIENT_ID:eearly-user-administrator}
      secret: ${KEYCLOAK_CLIENT_SECRET:Bsa577WMV3pHJ5zbixsarDsM8wdGiL6U}

spring:
  application.name: eearly
  mvc.throw-exception-if-no-handler-found: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URI:${keycloak.auth-server-url}/realms/${keycloak.realm}}

  flyway:
    baselineOnMigrate: true
    enabled: true
    schemas: common
    locations:
      - classpath:/db/migration/common

  datasource:
    driverClassName: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

taskqueue:
  retry.count: 10
  cron.expression: 0/15 * * * * *

sensor:
  dexcom:
    base-uri: https://sandbox-api.dexcom.com
    redirect-uri: http://localhost:8181
    client:
      id: changeme
      secret: changeme

  ultrahuman:
    base-uri: https://partner.ultrahuman.com
    authorization: changeme

# Service account location. Can be a filesystem path or a classpath resource. NB: Generate and use your own firebase-service-account.json file.
firebase:
  service-account: classpath:eearly-81b14-7704d412928d.json