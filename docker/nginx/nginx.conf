user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Onboarding links carry a one-time code in the path: log those paths without it.
    map $request_uri $loggable_request_uri {
        default  $request_uri;
        "~^/api/v1/onboarding/(?!create-user(\?|$)|users/[^/?]+/onboarding-link(\?|$))"  /api/v1/onboarding/[redacted];
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request_method $loggable_request_uri $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
